# Repeated inside every location that sets its own add_header (nginx does not inherit add_header into such a location).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# Browsers honour this only over https and ignore it on plain http, so one file serves the test server and the TLS server.
# Start with a short max-age while testing; raise it once the site is settled.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
