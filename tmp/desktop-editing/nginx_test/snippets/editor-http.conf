# SurveyScriber report editor: nginx http-level settings (client spec v1.3 section 17).
# Include this file once inside the http { } block, before the server block.

# Never write the one-time link token to a log: the landing page path is /open/<token>.
map $request_uri $editor_loggable_uri {
    ~^/open/    "/open/[token]";
    default     $request_uri;
}
log_format editor_masked '$remote_addr - [$time_local] "$request_method $editor_loggable_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Guessing tokens: the backend limits too; this is a second wall in front of it.
limit_req_zone $binary_remote_addr zone=editor_open:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

# Default time to wait for the backend; the AI location below raises it.
proxy_read_timeout 60s;
