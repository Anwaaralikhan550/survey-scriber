# SurveyScriber report editor on a SHARED nginx server: only what must live at http level, with names no other site uses.
# (editor-http.conf also sets server_tokens and limit_req_status for the whole server; here they are set inside the editor's server block instead.)
map $request_uri $editor_loggable_uri {
    ~^/open/    "/open/[token]";
    default     $request_uri;
}
log_format editor_masked '$remote_addr - [$time_local] "$request_method $editor_loggable_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=editor_open:10m rate=10r/m;
