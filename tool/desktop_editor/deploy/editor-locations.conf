# SurveyScriber report editor: everything that goes inside the server { } block (plain HTTP test server and the TLS server share it).
# Variables to set in the server block before including:  none.  Upstream: the backend on 127.0.0.1:3000 (change `proxy_pass` hosts).

root /var/www/editor;          # the Vite build: tool/desktop_editor/dist
index index.html;
access_log /var/log/nginx/editor-access.log editor_masked;

client_max_body_size 13m;      # everything else: photos are at most 10 MB (12 MB multipart ceiling); report documents and archives have their own limits below

# ---- headers on every answer (static pages and API) ----
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---- hidden files, methods ----
location ~ /\.            { return 404; }
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

# ---- the app ----
# The link page. The token is in the path; the page sends it to the API in a POST body and then removes it from the address bar.
location ^~ /open/ {
    add_header Cache-Control "no-store" always;
    # add_header lines of the server block do not carry into a location that has its own, so repeat them via an include:
    include /etc/nginx/snippets/editor-security-headers.conf;
    try_files /index.html =404;
}
location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/editor-security-headers.conf;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/editor-security-headers.conf;
    try_files $uri =404;
}
# After the token is read the page rewrites its address to /editor; a reload there must still open the app.
location = /editor {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/editor-security-headers.conf;
    try_files /index.html =404;
}
location = / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/editor-security-headers.conf;
    try_files /index.html =404;
}

# ---- the API (same origin as the page: the session cookie is SameSite=Strict and needs no CORS) ----
location = /api/v1/editor/open {
    limit_req zone=editor_open burst=5 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
# AI suggestions can take up to two minutes when the model retries.
location ~ ^/api/v1/editor/reports/[^/]+/ai/ {
    proxy_read_timeout 130s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
# ---- the phone app's report routes (v1.4). nginx stops a body before the backend sees it, so these need their own limits. ----
# Original and final PDF/Word documents: up to 60 MB (REPORT_FILE_MAX_MB) plus the multipart envelope.
location ~ ^/api/v1/reports/[^/]+/files$ {
    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
# Restoring a complete archive: up to 256 MB (REPORT_ARCHIVE_MAX_MB). Checking and restoring a large archive takes a while.
location = /api/v1/reports/restore-archive {
    client_max_body_size 260m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
# Building the archive reads every file of the report.
location ~ ^/api/v1/reports/[^/]+/archive$ {
    proxy_read_timeout 300s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/editor-proxy.conf;
}
